# ============================================================
# mysql：本地 MySQL
#
# 使用前请先创建数据库：
#   CREATE DATABASE smart_content DEFAULT CHARACTER SET utf8mb4;
#
# 账号密码通过环境变量注入，避免明文写进仓库：
#   DB_USERNAME / DB_PASSWORD
# ============================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smart_content}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

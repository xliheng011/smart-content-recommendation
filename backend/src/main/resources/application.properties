spring.application.name=backend

# ============================================================
# 运行环境切换
#
#   dev   -> H2 内存库，无需安装 MySQL / Redis 即可启动（默认）
#   mysql -> 本地 MySQL
#
# 切换方式（任选其一）：
#   1) 环境变量：APP_PROFILE=mysql
#   2) 启动参数：--spring.profiles.active=mysql
# ============================================================
spring.profiles.active=${APP_PROFILE:dev}

# ============================================================
# 服务端口
# ============================================================
server.port=8080

# ============================================================
# JPA
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# Redis
#
# 注意：Redis 不可用不会导致启动失败，
# CacheService 会自动降级为进程内缓存，接口依然可用。
# ============================================================
# 注意：这里默认使用 127.0.0.1 而不是 localhost。
# Windows 下 localhost 可能优先解析为 IPv6 的 ::1，
# 而 Redis 默认只监听 IPv4，会导致连接被拒绝。
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=800ms
spring.data.redis.connect-timeout=500ms
spring.data.redis.lettuce.shutdown-timeout=100ms

# ============================================================
# JSON
# ============================================================
spring.jackson.time-zone=Asia/Shanghai

# ============================================================
# 跨域（逗号分隔）
# ============================================================
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174
